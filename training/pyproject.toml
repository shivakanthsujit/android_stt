[project]
name = "local-flow-cleanup-training"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "huggingface-hub==1.24.0",
  "peft==0.19.1",
  "pyarrow==25.0.0",
  "safetensors==0.8.0",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==5.14.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
