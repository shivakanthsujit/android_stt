[project]
name = "localflow-s1-litert-conversion"
version = "0.1.0"
description = "Pinned Linux-only environment for S1-mini LiteRT-LM conversion"
requires-python = "==3.11.*"
dependencies = [
  "ai-edge-quantizer==0.8.0",
  # ai-edge-litert 2.1.6 leaves this dependency unconstrained. Version 1.3+
  # intentionally excludes Python 3.11 even though LiteRT Torch recommends it.
  "backports-strenum==1.2.8",
  "litert-torch==0.9.3",
]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
